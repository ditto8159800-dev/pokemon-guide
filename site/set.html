<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡盒介紹｜寶可夢卡牌學習站</title><link rel="stylesheet" href="assets/style.css">
<script src="data/sets.js"></script><script src="assets/common.js"></script></head>
<body><div class="layout"><main id="m"><p>載入中…</p></main></div>
<script>
const k=new URLSearchParams(location.search).get('k');const s=SETS.find(x=>x.key===k);const m=document.getElementById('m');
// non-Japanese set links (e.g. from quiz explanations): jump to the Japanese counterpart when there is one
if(!s&&window.SET_ALIAS&&SET_ALIAS[k]) location.replace('set.html?k='+encodeURIComponent(SET_ALIAS[k]));
const eraName=Object.fromEntries(ERAS);
if(!s){m.innerHTML=(window.SET_ALIAS&&SET_ALIAS[k])?'<p>轉到對應的日版卡盒…</p>':'<h1>找不到這個卡盒</h1><p>本站目前只收錄日版卡盒；這個連結可能是其他語言版本，或已不存在。</p><p><a href="index.html">回總覽</a></p>';}
else{
  document.title=(s.nameZh||s.name)+'｜寶可夢卡牌學習站';
  const byKey=Object.fromEntries(SETS.map(x=>[x.key,x]));
  const nameRow=l=>s.names[l]?esc(s.names[l]):'<span class="muted">—（無此語言版本或未對應）</span>';
  let h=`<p class="small"><a href="index.html">← 卡盒總覽</a> / <a href="index.html?era=${s.era}">${eraName[s.era]}</a></p>
  <div class="detail-head"><div class="logo">${imgTag(s.box?.img||s.logo||s.symbol||s.thumb,s.name)}${s.box?`<div class="small muted">卡盒圖片：<a href="${esc(s.box.url)}" target="_blank" rel="noopener">${esc(s.box.source)}</a></div>`:''}</div>
  <div><h1>${esc(s.nameZh||s.name)}</h1>${s.nameZh?`<div class="muted">日文名：${esc(s.name)}</div>`:''}<div class="badges">${s.rank?`<span class="b metal ${s.tier}">熱門第 ${s.rank} 名</span>`:''}${s.status==='full'?'<span class="b full">完整介紹</span>':'<span class="b todo">'+(s.v1?'資料待確認':'待補充')+'</span>'}${s.upcoming?'<span class="b up">即將發售</span>':''}</div>
  <div class="muted small">${s.translated?'英譯：'+esc(s.translated)+' · ':''}代號 ${esc(s.id)} · 資料來源 ${esc(s.src)}</div></div></div>
  <div class="panel"><table class="kv">
   <tr><td>日文名</td><td>${nameRow('ja')}</td></tr>
   <tr><td>中文名</td><td>${s.nameZh?esc(s.nameZh):nameRow('zh-tw')}</td></tr>
   <tr><td>英文名（參考）</td><td>${nameRow('en')}</td></tr>
   <tr><td>發售日</td><td>${s.date?esc(s.date):'待確認'+(s.approxDate?`（日版為 ${esc(s.approxDate)}）`:'')}</td></tr>
   <tr><td>時期 / 系列</td><td>${eraName[s.era]}${s.serie?' · '+esc(s.serie):''}</td></tr>
   <tr><td>卡片張數</td><td>${s.official?`官方編號 ${s.official} 張`:'待確認'}${s.total&&s.total>s.official?`，含秘密稀有共 ${s.total} 張`:''}</td></tr>
  </table></div>
  ${s.hotReason?`<div class="note">🔥 為什麼熱門：${esc(s.hotReason)}</div>`:''}
  <h2>📖 系列介紹</h2><div class="panel">${s.intro?`<p>${esc(s.intro)}</p>`:''}<p class="${s.intro?'small muted':''}">${esc(s.introAuto)}</p>${s.todo?`<div class="todo-box">📝 ${esc(s.todo)}</div>`:''}</div>`;
  if(s.v1){
    h+=`<h2>🏆 Top 10 大獎卡</h2>`;
    (s.notes||[]).forEach(n=>h+=`<div class="note">${esc(n)}</div>`);
    if(s.chase?.length){
      h+=`<div class="chase">${s.chase.map((c,i)=>`<div class="cc"><div class="rank">${i+1}</div>${c.img?`<a href="${esc(c.link?.url||c.imgHigh)}" target="_blank" rel="noopener" title="${c.link?'在 '+esc(c.link.kind)+' 查看這張卡':'放大卡圖'}"><img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="this.outerHTML='<div class=noimg>圖片無法載入</div>'"></a>`:(c.link?`<a href="${esc(c.link.url)}" target="_blank" rel="noopener"><div class="noimg">${esc(c.name)}<br>（暫無卡圖，點此看 ${esc(c.link.kind)}）</div></a>`:`<div class="noimg">${esc(c.name)}<br>（暫無卡圖）</div>`)}
        <div class="n">${c.nameZh?`<span class="nzh">${esc(c.nameZh)}</span><br><span class="small muted">${esc(c.name)}</span>`:`${esc(c.name)}<br><span class="small muted">（中文名待確認）</span>`}</div><div class="r">${esc(c.num)} · ${esc(c.rarity)}</div>${c.marketJpy?`<div class="small muted">排名依據：日本成交價約 ¥${Math.round(c.marketJpy).toLocaleString('en-US')}</div>`:''}${priceText(c.price)}</div>`).join('')}</div>
        <p class="small muted">價格為「約略參考價」：未鑑定價優先用 TCGplayer 日版市場價（沒有時用 SNKRDUNK 狀態 A 最低在售價，再沒有時用 Pokeca-Now 日本二手平台成交中位數）；PSA 10 優先用 SNKRDUNK 最低在售價，沒人在賣時用 SNKRDUNK 最近成交價或 Pokeca-Now 的 PSA 10 成交中位數；來源與日期如標示，不是即時報價，買賣前請自行確認。點卡圖會在新分頁打開這張卡的 TCGplayer 頁面（沒有 TCGplayer 頁面時改開 SNKRDUNK）。卡圖來源：TCGplayer 商品圖（同一版本），沒有時用 TCGdex。</p>`;
      if(s.evidence){const E=s.evidence;h+=`<h3>📣 為什麼是這 10 張</h3><div class="panel"><p>${esc(E.summary||'')}</p>${s.rankingSource?`<p class="small">排序依據：<a href="${esc(s.rankingSource.url)}" target="_blank" rel="noopener">${esc(s.rankingSource.name)}</a>（${esc(s.rankingSource.date)}）</p>`:''}<div class="small">社群討論來源：</div><ul class="pc small">${(E.sources||[]).map(x=>`<li>${x.lang==='ja'?'🇯🇵':x.lang==='zh'?'🇹🇼':'🇺🇸'} <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join('')}</ul></div>`;
        if(E.guarantee){const G=E.guarantee;h+=`<h3>📦 保底（每盒／每包一定有什麼）</h3><div class="panel"><p><b>官方：</b>${esc(G.official)} <a class="small" href="${esc(G.url)}" target="_blank" rel="noopener">官方來源</a></p>${G.community?`<p class="small"><b>玩家實測（非官方）：</b>${esc(G.community)} <a href="${esc(G.communityUrl)}" target="_blank" rel="noopener">來源</a></p>`:''}</div>`;}}
    } else h+=`<div class="todo-box">大獎卡：待確認</div>`;
  } else {
    h+=`<h2>🏆 大獎卡</h2><div class="todo-box">📝 待補充：2018 年以前的卡盒會在後續批次補上歷史介紹與 Top 10 大獎卡。</div>`;
  }
  m.innerHTML=h;
}
</script></body></html>
