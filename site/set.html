<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡盒介紹｜寶可夢卡牌學習站</title><link rel="stylesheet" href="assets/style.css">
<script src="data/sets.js"></script><script src="assets/common.js"></script></head>
<body><div class="layout"><main id="m"><p>載入中…</p></main></div>
<script>
const k=new URLSearchParams(location.search).get('k');const s=SETS.find(x=>x.key===k);const m=document.getElementById('m');
const eraName=Object.fromEntries(ERAS);
if(!s){m.innerHTML='<h1>找不到這個卡盒</h1><p><a href="index.html">回總覽</a></p>';}
else{
  document.title=s.name+'｜寶可夢卡牌學習站';
  const byKey=Object.fromEntries(SETS.map(x=>[x.key,x]));
  const links=s.links.map(k=>byKey[k]).filter(Boolean);
  const nameRow=l=>s.names[l]?esc(s.names[l]):'<span class="muted">—（無此語言版本或未對應）</span>';
  let h=`<p class="small"><a href="index.html">← 卡盒總覽</a> / <a href="index.html?era=${s.era}">${eraName[s.era]}</a></p>
  <div class="detail-head"><div class="logo">${imgTag(s.logo||s.symbol||s.thumb,s.name)}</div>
  <div><h1>${esc(s.name)}</h1><div class="badges"><span class="b ${s.lang}">${LANG_ZH[s.lang]}</span>${s.status==='full'?'<span class="b full">完整介紹</span>':'<span class="b todo">'+(s.v1?'資料待確認':'待補充')+'</span>'}${s.upcoming?'<span class="b up">即將發售</span>':''}</div>
  <div class="muted small">${s.translated?'英譯：'+esc(s.translated)+' · ':''}代號 ${esc(s.id)} · 資料來源 ${esc(s.src)}</div></div></div>
  <div class="panel"><table class="kv">
   <tr><td>中文名（繁中版）</td><td>${nameRow('zh-tw')}</td></tr>
   <tr><td>簡中名</td><td>${nameRow('zh-cn')}</td></tr>
   <tr><td>日文名</td><td>${nameRow('ja')}</td></tr>
   <tr><td>英文名</td><td>${nameRow('en')}</td></tr>
   <tr><td>發售日</td><td>${s.date?esc(s.date):'待確認'+(s.approxDate?`（日版為 ${esc(s.approxDate)}）`:'')}</td></tr>
   <tr><td>時期 / 系列</td><td>${eraName[s.era]}${s.serie?' · '+esc(s.serie):''}</td></tr>
   <tr><td>卡片張數</td><td>${s.official?`官方編號 ${s.official} 張`:'待確認'}${s.total&&s.total>s.official?`，含秘密稀有共 ${s.total} 張`:''}</td></tr>
   <tr><td>語言版本</td><td>${['en','ja','zh-tw','zh-cn'].map(l=>s.editions.includes(l)?`<span class="b ${l}">✓ ${LANG_ZH[l]}</span>`:`<span class="b">✗ ${LANG_ZH[l]}</span>`).join(' ')}<div class="small muted">✗ 代表本站資料中沒有找到對應版本（不一定代表沒有發行）。</div></td></tr>
   <tr><td>對應版本</td><td>${links.length||s.hopLinks.length?[...links,...s.hopLinks.map(k=>byKey[k]).filter(Boolean)].map(o=>`<a href="set.html?k=${encodeURIComponent(o.key)}">${LANG_ZH[o.lang]}《${esc(o.name)}》</a>${s.partialLinks.includes(o.key)?'<span class="small muted">（部分收錄）</span>':''}`).join('、'):'<span class="muted">無／待確認</span>'}</td></tr>
  </table></div>
  <h2>📖 系列介紹</h2><div class="panel">${s.intro?`<p>${esc(s.intro)}</p>`:''}<p class="${s.intro?'small muted':''}">${esc(s.introAuto)}</p>${s.todo?`<div class="todo-box">📝 ${esc(s.todo)}</div>`:''}</div>`;
  if(s.v1){
    h+=`<h2>🏆 Top 10 大獎卡</h2>`;
    (s.notes||[]).forEach(n=>h+=`<div class="note">${esc(n)}</div>`);
    if(s.chase?.length){
      h+=`<div class="chase">${s.chase.map((c,i)=>`<div class="cc"><div class="rank">${i+1}</div>${c.img?`<a href="${esc(c.imgHigh)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="this.outerHTML='<div class=noimg>圖片無法載入</div>'"></a>`:`<div class="noimg">${esc(c.name)}<br>（暫無卡圖）</div>`}
        <div class="n">${esc(c.name)}</div><div class="r">${esc(c.num)} · ${esc(c.rarity)}</div>${priceText(c.price)}</div>`).join('')}</div>
        <p class="small muted">價格為「約略參考價」：未鑑定（裸卡）狀態，來源與日期如標示；不是即時報價，買賣前請自行確認。</p>`;
    } else h+=`<div class="todo-box">大獎卡：待確認</div>`;
  } else {
    h+=`<h2>🏆 大獎卡</h2><div class="todo-box">📝 待補充：2018 年以前的卡盒會在後續批次補上歷史介紹與 Top 10 大獎卡。</div>`;
  }
  m.innerHTML=h;
}
</script></body></html>
